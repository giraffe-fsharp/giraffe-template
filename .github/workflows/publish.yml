name: Publish

on:
  push:
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.300
      - uses: NuGet/setup-nuget@v2
      - name: Validate tag version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          Import-Module ./.psscripts/build-functions.ps1 -Force
          $version = Get-NuspecVersion ./src/giraffe-template.nuspec
          Test-CompareVersions $version $env:GITHUB_REF_NAME
      - name: Build, test and pack
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: giraffe-template.*.nupkg
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Obtain NuGet key
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: login
        with:
          user: dsyme
      - name: Push to NuGet Feed
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key "$NUGET_KEY"
